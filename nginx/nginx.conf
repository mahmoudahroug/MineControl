events {}

http {
    server {
        listen 80;
        server_name dahraga.duckdns.org;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dahraga.duckdns.org;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/dahraga.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dahraga.duckdns.org/privkey.pem;
        # HSTS to enforce HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://controller-app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}