<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineControl</title>
    <!-- Basic styling for better presentation -->
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .panel { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; }
        #server-status { font-size: 1.2rem; font-weight: bold; margin: 1rem 0; }
        .online { color: #28a745; }
        .offline { color: #dc3545; }
        input, button { padding: 0.75rem; margin: 0.5rem; border-radius: 4px; border: 1px solid #ccc; font-size: 1rem; }
        button { cursor: pointer; background-color: #007bff; color: white; border-color: #007bff; }
        button:hover { background-color: #0056b3; }
        #response-message { margin-top: 1rem; color: #555; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>MineControl Panel</h1>
        
        <div id="server-status">Checking status...</div>

        <form id="control-form">
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit" name="action" value="start">Start Server</button>
            <button type="submit" name="action" value="stop">Stop Server</button>
        </form>
        
        <p id="response-message"></p>
    </div>

    <script>
        const form = document.getElementById('control-form');
        const statusDiv = document.getElementById('server-status');
        const responseMessage = document.getElementById('response-message');

        // Function to check the server status
        const checkStatus = async () => {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                statusDiv.textContent = `Server is ${data.status}`;
                statusDiv.className = data.status.toLowerCase(); // Adds 'online' or 'offline' class
            } catch (error) {
                statusDiv.textContent = 'Could not get server status.';
                statusDiv.className = 'offline';
            }
        };

        // Handle form submission without reloading the page
        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Stop the default page reload

            // Figure out which button was clicked
            const action = event.submitter.value;
            const password = form.elements.password.value;

            responseMessage.textContent = `Performing action: ${action}...`;

            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, action })
                });

                const result = await response.json();

                if (!response.ok) {
                    // Handle HTTP errors like 401 or 500
                    throw new Error(result.message || 'An unknown error occurred.');
                }
                
                responseMessage.textContent = result.message;
                // After an action, re-check the status in a couple of seconds
                setTimeout(checkStatus, 2000); 
            } catch (error) {
                responseMessage.textContent = `Error: ${error.message}`;
                responseMessage.style.color = 'red';
            }
        });

        // Check status when the page loads, and then every 10 seconds
        checkStatus();
        setInterval(checkStatus, 10000);
    </script>

</body>
</html>
